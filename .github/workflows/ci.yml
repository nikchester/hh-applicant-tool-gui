name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            termux/requirements-hh.txt
            termux/requirements-chatmock.txt
      - name: Check tracked files and configuration
        shell: bash
        run: |
          python termux/check_repository.py
          for file in termux/*.sh; do sh -n "$file"; done
          python -m compileall -q termux
      - name: Install application dependencies
        run: python -m pip install -r termux/requirements-hh.txt -r termux/requirements-chatmock.txt
      - name: Run offline tests (no account or HH requests)
        run: |
          python termux/check_hh.py
          python termux/check_chatmock.py
          python windows/check_windows.py
          python windows/check_send.py
