name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            termux/requirements-hh.txt
            termux/requirements-chatmock.txt
      - name: Check tracked files and configuration
        shell: bash
        run: |
          python termux/check_repository.py
          for file in termux/*.sh; do sh -n "$file"; done
          python -m compileall -q termux
      - name: Install application dependencies
        run: python -m pip install -r termux/requirements-hh.txt -r termux/requirements-chatmock.txt
      - name: Run offline tests (no account or HH requests)
        run: |
          python termux/check_hh.py
          python termux/check_chatmock.py
